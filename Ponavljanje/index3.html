<canvas id="slika" width="480" height="454"></canvas>

<script>
const canvas = document.getElementById("slika");
const ctx = canvas.getContext("2d");


ctx.fillStyle = "#87ceeb";
ctx.fillRect(0, 0, 480, 454);


ctx.fillStyle = "#ffcc22";
ctx.beginPath();
ctx.arc(98, 103, 39, 0, Math.PI * 2);

ctx.fillStyle = "white";

ctx.arc(330, 90, 38, 0, Math.PI * 2);
ctx.arc(370, 88, 22, 0, Math.PI * 2);
ctx.fillRect(330, 90, 62, 28);

ctx.fillStyle = "#2185d0";

ctx.fillStyle = "#ffd323";
ctx.beginPath();
ctx.moveTo(295, 323);
ctx.quadraticCurveTo(350, 225, 445, 323);
ctx.fill();


ctx.fillStyle = "#fff8dc";
ctx.fillRect(320, 234, 60, 56);

ctx.fillStyle = "#ff493f";
ctx.beginPath();
ctx.moveTo(310, 234);

ctx.fillStyle = "#222";
ctx.fillRect(350, 265, 14, 25);

ctx.fillStyle = "#1675c9";
ctx.beginPath();
ctx.arc(338, 253, 8, 0, Math.PI * 2);

ctx.fillStyle = "#333";
ctx.fillRect(405, 242, 10, 50);

ctx.beginPath();

ctx.fillStyle = "#ff454f";

ctx.fillStyle = "white";
ctx.beginPath();

ctx.fillStyle = "white";

[148, 188, 228].forEach(x => {
    ctx.beginPath();
    ctx.arc(x, 309, 11, 0, Math.PI * 2);
    ctx.fill();
});


ctx.fillStyle = "#75d0f5";

function val(x, y) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 35, y + 45, x + 70, y);
    ctx.closePath();
    ctx.fill();
}

[20, 100, 180, 260, 340].forEach(x => val(x, 360));
[60, 145, 230, 315, 400].forEach(x => val(x, 405));

</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak8-JavaScript</title>
    <style>
        
  .kartica { padding: 20px; border: 1px solid gray; }
  .istaknuto { background-color: gold; border: 3px solid orange; font-weight: bold; }

    </style>
</head>
<body>
    <div id="kartica" class="kartica">Ovo je kartica.</div>
<button id="gumb">Uključi/isključi istaknuti izgled</button>
    <script>

    const kartica = document.getElementById("kartica");
    const gumb = document.getElementById("gumb");
    gumb.onclick = function() {
      kartica.classList.toggle("istaknuto");
    };
  
    </script>
</body>
</html>

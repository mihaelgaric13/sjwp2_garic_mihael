<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="gumb">Povećaj broj</button>
    <p>Broj klikova: <span id="broj" style="color: green">22</span></p>
    <script>
      const gumb = document.getElementById("gumb");
      const broj = document.getElementById("broj");
      let klikovi = 0;

      gumb.onclick = function () {
        klikovi = klikovi + 1;
        broj.textContent = klikovi;
        if (klikovi >= 10) {
          broj.style.color = "green";
        }
      };
    </script>
  </body>
</html>

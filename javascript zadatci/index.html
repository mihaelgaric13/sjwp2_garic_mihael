<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Color Changer</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #ff393f;
        height: 100vh;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background 0.5s ease;
        overflow: hidden;
      }

      .container {
        width: 100%;
        height: 100vh;
        position: relative;
        text-align: center;
        color: #310006;
      }

      .number {
        position: absolute;
        top: 25px;
        left: 25px;
        color: white;
        font-family: "Oswald", sans-serif;
        font-size: 22px;
      }

      h1 {
        position: absolute;
        top: 13%;
        width: 100%;
        font-family: "Anton", sans-serif;
        font-size: clamp(40px, 9vw, 85px);
        line-height: 1.05;
        text-transform: uppercase;
      }

      .arrow {
        position: absolute;
        top: 48%;
        transform: translateY(-50%);
        background: #ffc1c1;
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        font-size: 23px;
        cursor: pointer;
        color: #b84c50;
      }

      .left {
        left: 12px;
      }

      .right {
        right: 12px;
      }

      .change-btn {
        position: absolute;
        top: 58%;
        left: 50%;
        transform: translateX(-50%);
        background: #111;
        color: white;
        border: none;
        border-radius: 40px;
        padding: 17px 30px;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
      }

      .change-btn:hover {
        background: #333;
        transform: translateX(-50%) scale(1.08);
      }

      .difficulty {
        position: absolute;
        bottom: 13%;
        width: 100%;
        font-family: "Oswald", sans-serif;
        font-size: 23px;
        text-transform: uppercase;
      }

      .logo {
        position: absolute;
        bottom: 25px;
        left: 25px;
        color: white;
        font-size: 10px;
      }

      .dots {
        position: absolute;
        bottom: 17px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ffaaaa;
      }

      .dot.active {
        background: white;
      }

      @media (max-width: 500px) {
        h1 {
          font-size: 48px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="number">02</div>

      <h1>
        Background<br />
        Color Changer
      </h1>

      <button class="arrow left" onclick="previousColor()">‹</button>
      <button class="arrow right" onclick="nextColor()">›</button>

      <button class="change-btn" onclick="changeBackground()">
        CHANGE BACKGROUND
      </button>

      <div class="difficulty">Difficulty: Easy</div>

      <div class="dots" id="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <script>
      const colors = [
        "#ff393f",
        "#3498db",
        "#2ecc71",
        "#9b59b6",
        "#f1c40f",
        "#e67e22",
        "#1abc9c",
        "#34495e",
        "#ff69b4",
        "#ffffff",
      ];

      let currentColor = 0;

      function updateBackground() {
        document.body.style.background = colors[currentColor];

        const dots = document.querySelectorAll(".dot");

        dots.forEach((dot, index) => {
          dot.classList.toggle("active", index === currentColor);
        });
      }

      function changeBackground() {
        currentColor = Math.floor(Math.random() * colors.length);
        updateBackground();
      }

      function nextColor() {
        currentColor++;

        if (currentColor >= colors.length) {
          currentColor = 0;
        }

        updateBackground();
      }

      function previousColor() {
        currentColor--;

        if (currentColor < 0) {
          currentColor = colors.length - 1;
        }

        updateBackground();
      }
    </script>
  </body>
</html>

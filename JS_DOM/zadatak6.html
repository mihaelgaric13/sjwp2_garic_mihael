<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak6-JavaScript</title>
</head>
<body>
    <p style="color: red;">Prvi odlomak</p>
<p style="color: blue;">Drugi odlomak</p>
<p style="color: green;">Treći odlomak</p>
    <script>

    const odlomci = document.querySelectorAll("p");
    odlomci[0].style.color = "red";
    odlomci[1].style.color = "blue";
    odlomci[2].style.color = "green";
  
    </script>
</body>
</html>

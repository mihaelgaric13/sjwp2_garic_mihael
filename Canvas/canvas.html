<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>

    <canvas id="myCanvas" width="600" height="600" style="border: 1px solid red;"></canvas>

    <script>
let c=document.getElementById("myCanvas");
let ctx = c.getContext("2d");


// cetverokut
ctx.beginPath();
ctx.rect(0, 0,  100, 200);
ctx.fillStyle="green";
ctx.fill();


//krug
ctx.beginPath();
ctx.arc(300,300, 80, 0,2*Math.PI);
ctx.stroke();

//trokut
ctx.beginPath();
ctx.moveTo(300,250);
ctx.lineTo(400,350);
ctx.lineTo(200,350);
ctx.lineTo(300,250);
ctx.stroke();
ctx.strokeStyle="blue";




    </script>

</body>
</html>
